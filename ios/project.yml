# XcodeGen spec — generate the Xcode project with:
#   brew install xcodegen && cd ios && xcodegen
# All identifiers come from Config/AppConfig.xcconfig.
name: PulseBoard
options:
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: $(TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: $(MARKETING_VERSION)
    CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  PulseCore:
    path: Packages/PulseCore
  PulseKit:
    path: Packages/PulseKit

targets:
  # ───────────────────────── iPhone + iPad app ─────────────────────────
  PulseBoard:
    type: application
    platform: iOS
    sources:
      - path: PulseBoard
      - path: Shared
    dependencies:
      - package: PulseCore
      - package: PulseKit
      - target: PulseBoardWidgets
      - target: PulseBoardWatch
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: PulseBoard/PulseBoard.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.icloud-container-identifiers: [$(ICLOUD_CONTAINER)]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [$(APP_GROUP)]
        aps-environment: development
    info:
      path: PulseBoard/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch, processing, remote-notification]
        BGTaskSchedulerPermittedIdentifiers:
          - $(BUNDLE_ID_PREFIX).pulseboard.backfill
          - $(BUNDLE_ID_PREFIX).pulseboard.refresh
        NSHealthShareUsageDescription: "$(APP_NAME) reads your Apple Health data (activity, workouts, sleep, heart, vitals, body and nutrition) to build your dashboard, trends and scores. Your health data stays on your devices and is never uploaded, sold or used for advertising."
        NSHealthUpdateUsageDescription: "$(APP_NAME) saves the food, water, workouts, weight and other entries you log to Apple Health so they appear on your other devices and in other apps you choose."
        NSLocationWhenInUseUsageDescription: "$(APP_NAME) uses your approximate location (city or region only) to show local challenges. Precise location is never used or shared."
        NSLocationDefaultAccuracyReduced: true
        PBBundleIdPrefix: $(BUNDLE_ID_PREFIX)
        PBAppGroup: $(APP_GROUP)
        PBICloudContainer: $(ICLOUD_CONTAINER)
        PBChallengesPreview: $(CHALLENGES_PREVIEW)
        PBProductMonthly: $(PRODUCT_ID_MONTHLY)
        PBProductYearly: $(PRODUCT_ID_YEARLY)
        PBSubscriptionGroupID: $(SUBSCRIPTION_GROUP_ID)
        PBPrivacyPolicyURL: $(PRIVACY_POLICY_URL)
    scheme:
      storeKitConfiguration: PulseBoard.storekit
      gatherCoverageData: true

  # ───────────────────────── Home & Lock Screen widgets ─────────────────
  PulseBoardWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PulseBoardWidgets
      - path: Shared
    dependencies:
      - package: PulseCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: PulseBoardWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    entitlements:
      path: PulseBoardWidgets/PulseBoardWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: PulseBoardWidgets/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PBAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ───────────────────────── Apple Watch app ─────────────────────────────
  PulseBoardWatch:
    type: application
    platform: watchOS
    sources:
      - path: PulseBoardWatch
      - path: Shared
    dependencies:
      - package: PulseCore
      - package: PulseKit
      - target: PulseBoardWatchWidgets
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: PulseBoardWatch/PulseBoardWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: PulseBoardWatch/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)
        NSHealthShareUsageDescription: "$(APP_NAME) reads your health data to show today's stats and readiness on your watch. Your data stays on your devices."
        NSHealthUpdateUsageDescription: "$(APP_NAME) saves water and other quick entries you log on your watch to Apple Health."
        PBBundleIdPrefix: $(BUNDLE_ID_PREFIX)
        PBAppGroup: $(APP_GROUP)

  # ───────────────────────── Watch complications (WidgetKit) ─────────────
  PulseBoardWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: PulseBoardWatchWidgets
      - path: Shared
    dependencies:
      - package: PulseCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: PulseBoardWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp.widgets
        SKIP_INSTALL: YES
    entitlements:
      path: PulseBoardWatchWidgets/PulseBoardWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: PulseBoardWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PBAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  PulseBoardTests:
    build:
      targets:
        PulseBoard: all
    test:
      targets:
        - package: PulseCore/PulseCoreTests
